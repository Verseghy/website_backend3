# Sea-ORM migrations of backend3 (ADR 0009). `src/app.rs` passes `Migrator`
# to Loco's `create_app`, and `backend3-cli db ...` runs it.
[package]
name = "migration"
version = "0.1.0"
description = "Sea-ORM migrations of backend3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "migration"
path = "src/lib.rs"

# The requirements, features and reasons are in [workspace.dependencies] of
# the root Cargo.toml; a new dependency goes there first (the header of that
# file says why).
[dependencies]
# loco-rs with the workspace features; `with-db` brings sea-orm-migration
# with the PostgreSQL driver.
loco-rs = { workspace = true }
async-trait = { workspace = true }
sea-orm-migration = { workspace = true }

# The media server's complete nginx configuration (ADR 0015 §1).
#
# The media server is the image named in deploy/media/image.txt. It serves
# the uploads volume's app/public/ tree as /storage/** on all three hosts and
# nothing else. This file is the only source of that configuration:
# website_k8s copies it byte for byte into the media ConfigMap, at a named
# commit of this repository (deploy/media/README.md). Edit it here, never
# there.
#
# The required behaviour is the media contract of ADR 0015 §1 with the two
# header rows of ADR 0013 §7. tests/media_contract/ checks it against this
# file in the pinned image, in the Test job; that suite is the authority,
# not the comments here.
#
# The server runs under restricted-v2 with an arbitrary UID, GID 0, no
# capabilities and a read-only root filesystem (ADR 0023 §8). It writes only
# below /tmp, which the Deployment backs with an emptyDir. Start it with
# `nginx -e /dev/stdout`: `-e` moves the error log nginx opens before it reads
# this file (/var/log/nginx/error.log, not writable here) to stdout, and the
# image's s2i run script is not used, because it writes to the root
# filesystem.

# One worker serves the static files of a small school site, and the edge node
# has little memory to spare. "auto" would start one worker per host CPU,
# whatever the pod's CPU limit is.
worker_processes 1;
# The container's main process; the s2i run script, which would pass
# `-g "daemon off;"` as well, is not used (see above).
daemon off;
pid /tmp/nginx.pid;
# ADR 0015 §1, Logs: access and error logs both go to stdout. /dev/stdout is
# opened again by path, as the access log below is.
error_log /dev/stdout notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # The image's mime.types lacks .jfif, which ADR 0015 §6 counts as JPEG;
    # without this line those gallery images would be served as
    # application/octet-stream with Content-Disposition: attachment.
    types {
        image/jpeg jfif;
    }
    default_type application/octet-stream;
    types_hash_max_size 4096;

    # One line per request on stdout (ADR 0015 §1, Logs): the router's
    # address, the client chain the router forwards, the request, the answer
    # and its duration. No request body, cookie or authorisation header is
    # logged (ADR 0023 §9).
    log_format media '$remote_addr "$http_x_forwarded_for" [$time_iso8601] '
                     '"$request" $status $body_bytes_sent $request_time '
                     '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout media;

    # nginx creates its temp directories at start-up, even though nothing here
    # proxies or keeps a request body. The compiled-in ones are below
    # /var/lib/nginx on the read-only root filesystem, so they move to /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Large files go out with sendfile; nothing is buffered (ADR 0015 §1).
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    # Compression would break byte ranges for pdf.js, and the payload is
    # already-compressed images and PDFs.
    gzip off;
    # No open_file_cache: a file that backend3 writes, renames or removes must
    # show up, or 404, on the next request (ADR 0015 §3, co-mount step 4).

    # Every map below feeds one add_header line of the server block; an empty
    # value sends no header. The header lines run when the response headers
    # are built. By then the not-modified check has turned a 200 into 304, but
    # the range filter turns a 200 into 206 or 416 only afterwards, so $status
    # is 200 for every file response, ranged or not.
    #
    # A 416 builds its headers twice: once as the file's 200, and again for
    # the error page, without clearing the first set (ngx_http_range_filter_module.c,
    # ngx_http_special_response.c). Every map is therefore `volatile`, so it
    # is evaluated again in the second pass, where $status is 416, and gives
    # "" for any header that the first pass has already added. Without that,
    # a 416 would carry Access-Control-Allow-Origin twice, which browsers
    # reject.

    map $status $media_allow_origin {
        volatile;
        416     "";
        default "*";
    }

    # pdf.js reads Content-Range and Content-Length cross-origin (ADR 0015 §1).
    map $status $media_expose_headers {
        volatile;
        416     "";
        default "Accept-Ranges, Content-Range, Content-Length";
    }

    map $status $media_nosniff {
        volatile;
        416     "";
        default "nosniff";
    }

    # Allow on 405 and on the preflight, and the preflight's
    # Access-Control-Allow-Methods. A 416 answers a GET or HEAD, so it gets "".
    map $request_method $media_methods {
        volatile;
        GET     "";
        HEAD    "";
        default "GET, HEAD, OPTIONS";
    }

    # The CORS preflight lets pdf.js send Range cross-origin (ADR 0015 §1).
    map $request_method $media_preflight_headers {
        volatile;
        OPTIONS "Range";
        default "";
    }

    # 7200 s is the most that Chromium honours; Firefox and WebKit accept it.
    map $request_method $media_preflight_max_age {
        volatile;
        OPTIONS "7200";
        default "";
    }

    # The sandbox of ADR 0013 §7 on every response except a PDF, whose viewer
    # may refuse to render in a sandboxed document. The key is
    # "status|type|uri": the status is three digits and a type from the types
    # table has no "|", so only the URI, which comes last, can contain one.
    # Regular expressions are tried in order, and the first match wins.
    # - The exemption covers the file's own responses only: 200 (every 206
    #   too) and 304. $sent_http_content_type names the file's type even on a
    #   preflight 204, which sends no type and so gets the policy.
    # - A 304 sends no type either, and a browser merges its headers into the
    #   cached file, so a policy there would sandbox the cached PDF. Only .pdf,
    #   in any case, maps to application/pdf in the types table, so for a 304
    #   the URI tells.
    # - A 416 is an HTML error page and needs the policy, but its first pass
    #   has already added it unless the file is a PDF; again the URI tells.
    map "$status|$sent_http_content_type|$uri" $media_csp {
        volatile;
        "~*^304\|[^|]*\|.*\.pdf$" "";
        "~*^416\|[^|]*\|.*\.pdf$" "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
        "~^416\|" "";
        "~*^200\|application/pdf(?:;[^|]*)?\|" "";
        default "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
    }

    # ADR 0013 §7: a file response whose type is outside the four raster types
    # and PDF is a download; /storage/sitemap.xml, which backend3 writes, is
    # not. Same key as above. Only status 200 (which includes every 206) gets
    # it; a 416's first pass is a 200, so a 416 for such a file carries it too.
    map "$status|$sent_http_content_type|$uri" $media_disposition {
        volatile;
        "~^200\|(?:image/(?:jpeg|png|gif|webp)|application/pdf)\|/storage/" "";
        "~^200\|[^|]*\|/storage/sitemap\.xml$" "";
        "~^200\|[^|]*\|/storage/" "attachment";
        default "";
    }

    # ADR 0015 §1, Caching: entity images have unique names per upload, while
    # uploads/ names can be replaced. Only file responses (200, 206 and 304,
    # and a 416 through its first pass) carry it, so a 404 is never cached.
    map "$status|$uri" $media_cache_control {
        volatile;
        "~^(?:200|304)\|/storage/(?:posts_images|authors_images|colleagues_images)/" "public, max-age=31536000, immutable";
        "~^(?:200|304)\|/storage/" "public, max-age=3600";
        default "";
    }

    server {
        listen 8080 default_server;
        # The PVC subPath app/public is mounted read-only at /srv/media/storage,
        # so /storage/<path> maps to app/public/<path>, byte for byte.
        root /srv/media;
        autoindex off;
        # A multi-range request gets the whole file with 200 (ADR 0015 §1).
        max_ranges 1;
        # RFC 9110 semantics, as tower-http's ServeDir has them: 304 when the
        # file is not newer than the date. The default, "exact", answers 304
        # only to the exact Last-Modified value.
        if_modified_since before;
        # Regular files only, also below the storage root: a path with a
        # symbolic link in any segment after /srv/media, whether it points
        # into the tree or out of it, is not served. try_files then answers
        # 404 as for a missing file, and nginx logs the refused open at crit
        # level. The public media hold no links, and backend3's uploads treat
        # one as a path escape (ADR 0015, "What must be true"). from= skips
        # the mount path itself, which the cluster lays out.
        disable_symlinks on from=$document_root;

        # Server level on purpose: every location inherits these lines, and so
        # do the responses that nginx builds before it picks a location (400,
        # or 405 for TRACE). A location that set any add_header of its own
        # would inherit none of them, so no location does. "always" adds a
        # header to every status, not only to 2xx and 3xx.
        add_header Access-Control-Allow-Origin $media_allow_origin always;
        add_header Access-Control-Expose-Headers $media_expose_headers always;
        add_header Access-Control-Allow-Methods $media_methods always;
        add_header Access-Control-Allow-Headers $media_preflight_headers always;
        add_header Access-Control-Max-Age $media_preflight_max_age always;
        add_header Allow $media_methods always;
        add_header X-Content-Type-Options $media_nosniff always;
        add_header Content-Security-Policy $media_csp always;
        add_header Content-Disposition $media_disposition always;
        add_header Cache-Control $media_cache_control always;

        # The probe of the Deployment (ADR 0015 §1). No Route sends /healthz
        # here: the Routes only carry /storage.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /storage/ {
            # A return inside if is one of the uses of if that nginx documents
            # as safe.
            if ($request_method !~ ^(?:GET|HEAD|OPTIONS)$) {
                return 405;
            }
            # The CORS preflight, answered for any path.
            if ($request_method = OPTIONS) {
                return 204;
            }
            # Regular files only. try_files tests a directory only for an
            # argument that ends in "/" in this file, which $uri does not, so
            # a directory, with or without a trailing slash, is 404: never a
            # listing, never its index.html, never a redirect.
            try_files $uri =404;

            # Any segment that starts with a dot (.htaccess, .gitignore and
            # files inside dot-directories stay on the volume, never served).
            location ~ /\. {
                return 404;
            }
        }

        location / {
            return 404;
        }
    }
}

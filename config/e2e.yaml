# Loco configuration of the `e2e` environment: the E2E CI job, which builds
# admin/dist and a debug backend3, starts it with LOCO_ENV=e2e, waits for
# GET http://localhost:5150/_ping and runs Playwright against
# http://localhost:5150/admin (ADR 0022 §3).
#
# Safety (ADR 0024 §4, layer 3): like test and development, e2e may only use
# a local database; `App::load_config` refuses anything else.

logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: compact

server:
  port: 5150
  binding: localhost
  host: http://localhost:5150
  middlewares:
    # ADR 0004 §3: no static middleware, no welcome fallback.
    static:
      enable: false
    fallback:
      enable: false
    compression:
      enable: true
    # ADR 0023 §6: the same headers as production, so the CSP-violation check
    # of the E2E run tests what production sends.
    secure_headers:
      enable: true
      preset: github
      overrides:
        Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        Referrer-Policy: "strict-origin-when-cross-origin"

# Jobs run inline, so a test sees their effect without a worker process.
workers:
  mode: ForegroundBlocking

cache:
  kind: InMem
  max_capacity: 1000

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/backend3_e2e") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

# The admin session (ADR 0006 §1). The secret is a throwaway local value,
# public like the compose password and allowed by ADR 0034 §2: the base64 of
# the sentence
# "backend3 e2e JWT secret: public and throwaway, used only by the E2E job and
# its server." Production reads its own from JWT_SECRET
# and must refuse this value (ADR 0034 §3).
auth:
  jwt:
    secret: "YmFja2VuZDMgZTJlIEpXVCBzZWNyZXQ6IHB1YmxpYyBhbmQgdGhyb3dhd2F5LCB1c2VkIG9ubHkgYnkgdGhlIEUyRSBqb2IgYW5kIGl0cyBzZXJ2ZXIu"
    # Two hours (ADR 0006 §1); the session cookie's Max-Age is this value.
    expiration: 7200
    # The session cookie first, then the Bearer header of scripts.
    location:
      - from: Cookie
        name: __Host-admin_session
      - from: Bearer

settings:
  admin_ui:
    # The admin build of the same CI run, relative to the repository root
    # where the job starts the server.
    dist_dir: admin/dist
  # /metrics on a port of its own, as in production (ADR 0023 §9).
  metrics:
    binding: 127.0.0.1
    port: 9464
  admin_auth:
    # The key that encrypts stored TOTP secrets (ADR 0006 §6). A throwaway
    # local value, public like the compose database's loco/loco and not a
    # secret, as ADR 0034 §2 item 3 allows
    # (docs/design/adr/0034-test-hashes-and-throwaway-keys-refused-in-production.md):
    # the base64 of the 110-byte sentence "backend3 TOTP encryption key:
    # public and throwaway, for development, test and e2e only; production
    # refuses it." Production reads its own key from TOTP_ENCRYPTION_KEY,
    # with no default, and refuses this one at boot (ADR 0034 §3).
    totp_encryption_key: "YmFja2VuZDMgVE9UUCBlbmNyeXB0aW9uIGtleTogcHVibGljIGFuZCB0aHJvd2F3YXksIGZvciBkZXZlbG9wbWVudCwgdGVzdCBhbmQgZTJlIG9ubHk7IHByb2R1Y3Rpb24gcmVmdXNlcyBpdC4="
  # How uploaded images are optimised (ADR 0015 §7, ADR 0033). `png`: the
  # oxipng preset by image size (ADR 0033 §5), preset 2 up to
  # `threshold_pixels` pixels and the cheaper `large_preset` (0 or 1) above;
  # the default derived in src/domain/image_optimise/png/effort.rs. Checked
  # at boot.
  image_optimisation:
    png:
      threshold_pixels: 6000000
      large_preset: 0

# Loco configuration of the `development` environment: `cargo loco start` on
# a developer machine, against the PostgreSQL that compose.yaml starts.
#
# Safety (ADR 0024 §4, layer 3): `App::load_config` refuses any database host
# here that is not local (localhost, 127.0.0.1, ::1 or a Unix socket). A
# container-network name such as `postgres` is refused too; run the app on the
# host against the published port.
#
# In development the Vite dev server serves the admin UI and proxies /api to
# http://localhost:5150 (ADR 0004 §4). The /admin route of this server only
# serves admin/dist when it has been built.

logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost
  middlewares:
    # ADR 0004 §3: no static middleware, no welcome fallback.
    static:
      enable: false
    fallback:
      enable: false
    # ADR 0015 §6, ADR 0023 §5: request bodies up to 128 MiB (134,217,728
    # bytes), for media uploads; Loco's default is 2,000,000 bytes. The
    # admin API's JSON routes take at most 4 MiB, a limit of their own in
    # controllers::admin::routes. A body above either limit is answered 413
    # with the admin error envelope.
    limit_payload:
      body_limit: 128mib
    compression:
      enable: true
    # public-api.md §9: a request whose If-None-Match equals the ETag of a
    # public answer gets 304 Not Modified without a body. Loco turns it on
    # when the key is absent; it is written out, with `enable`, because a
    # key without `enable: true` turns it off (the vendored Loco skill,
    # recipes/middleware.md).
    etag:
      enable: true
    # ADR 0023 §6: the global headers; /admin overrides its own set.
    secure_headers:
      enable: true
      preset: github
      overrides:
        Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        Referrer-Policy: "strict-origin-when-cross-origin"

# The production queue set-up (ADR 0016 §3), so jobs behave as they will in
# production. Start with `cargo loco start --server-and-worker` to process
# them.
workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: <%= get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/backend3_development") %>
  max_connections: 2
  min_connections: 1
  num_workers: 1
  poll_interval_sec: 5
  dangerously_flush: false
  reaper:
    age_minutes: 30
    interval_seconds: 300

# Entries, not bytes (loco-rs 1.2.0 InMem has no weigher), ADR 0016 §2.
cache:
  kind: InMem
  max_capacity: 1000

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/backend3_development") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

# The admin session (ADR 0006 §1). The secret is a throwaway local value,
# public like the compose password and allowed by ADR 0034 §2: the base64 of
# the sentence
# "backend3 development JWT secret: public and throwaway, never valid on any
# deployment." Production reads its own from JWT_SECRET
# and refuses this value at boot (Settings::refuse_published_keys,
# ADR 0034 §3).
auth:
  jwt:
    secret: "YmFja2VuZDMgZGV2ZWxvcG1lbnQgSldUIHNlY3JldDogcHVibGljIGFuZCB0aHJvd2F3YXksIG5ldmVyIHZhbGlkIG9uIGFueSBkZXBsb3ltZW50Lg=="
    # Two hours (ADR 0006 §1); the session cookie's Max-Age is this value.
    expiration: 7200
    # The session cookie first, then the Bearer header of scripts.
    location:
      - from: Cookie
        name: __Host-admin_session
      - from: Bearer

settings:
  admin_ui:
    dist_dir: admin/dist
  # /metrics on a port of its own, never on the server port (ADR 0023 §9):
  # curl http://127.0.0.1:9464/metrics. An IP address, not localhost, so a
  # second server refuses to start on a taken port; set METRICS_PORT together
  # with PORT to run one next to the first.
  metrics:
    binding: 127.0.0.1
    port: <%= get_env(name="METRICS_PORT", default="9464") %>
  admin_auth:
    # The key that encrypts stored TOTP secrets (ADR 0006 §6). A throwaway
    # local value, public like the compose database's loco/loco and not a
    # secret, as ADR 0034 §2 item 3 allows
    # (docs/design/adr/0034-test-hashes-and-throwaway-keys-refused-in-production.md):
    # the base64 of the 110-byte sentence "backend3 TOTP encryption key:
    # public and throwaway, for development, test and e2e only; production
    # refuses it." Production reads its own key from TOTP_ENCRYPTION_KEY,
    # with no default, and refuses this one at boot (ADR 0034 §3).
    totp_encryption_key: "YmFja2VuZDMgVE9UUCBlbmNyeXB0aW9uIGtleTogcHVibGljIGFuZCB0aHJvd2F3YXksIGZvciBkZXZlbG9wbWVudCwgdGVzdCBhbmQgZTJlIG9ubHk7IHByb2R1Y3Rpb24gcmVmdXNlcyBpdC4="
    # The session limits and credential lifetimes of ADR 0006 §8, with the
    # ADR's defaults, which the maintainer kept (research: DECISIONS R9,
    # D07). No key has a default in the code, so each is written out; boot
    # refuses a duration of 0 and an absolute limit below 7200, naming the
    # key. `session_absolute_max_secs`: no session refresh sets an expiry
    # later than the sign-in plus this, 12 hours (ADR 0006 §1).
    session_absolute_max_secs: 43200
    # A reset link lasts 24 hours, a temporary password 72 hours (§5).
    reset_link_ttl_secs: 86400
    temp_password_ttl_secs: 259200
    # A legacy password shorter than 12 characters yields only a
    # password_change session (§6).
    force_change_short_legacy_password: true
    # The admin origin (ADR 0006 §3, ADR 0044): a cookie-authenticated write
    # to /api/admin must carry exactly this value in its Origin header: the
    # origin of this server, which serves the built admin at /admin. The Vite
    # dev server (`npm run dev`) proxies /api here and gives the requests of
    # its own pages this origin (admin/vite.config.ts), so both ways of
    # running the admin locally pass; a page on any other origin is refused.
    origin: "http://localhost:<%= get_env(name="PORT", default="5150") %>"
  # How uploaded images are optimised (ADR 0015 §7, ADR 0033).
  # `pixel_budget`: the largest pixel count decoded for one image, 50
  # megapixels (ADR 0015 §7). `png`: the oxipng preset by image size
  # (ADR 0033 §5), preset 2 up to `threshold_pixels` pixels and the cheaper
  # `large_preset` (0 or 1) above; the default derived in
  # src/domain/image_optimise/png/effort.rs. Checked at boot.
  image_optimisation:
    pixel_budget: 50000000
    png:
      threshold_pixels: 6000000
      large_preset: 0
  # The legacy import's source (data-migration.md §3.3, §4.1): a local
  # throwaway MySQL loaded from a synthetic fixture, never a production
  # database, such as compose.yaml's (`podman-compose --profile import up -d
  # mysql`): mysql://loco:loco@127.0.0.1:3306/verseghy. The guard hook blocks
  # cargo commands whose IMPORT_SOURCE_DATABASE_URL is not local, and the
  # task itself refuses a source that is not local here (ADR 0024 §4, layers
  # 2 and 3), the container-network name `mysql` included. Unset by default;
  # the import_mysql task then refuses to start, naming this key. Quoted and
  # escaped like production's, so any value reaches the task's own check.
  import:
    source_database_url: "<%= get_env(name='IMPORT_SOURCE_DATABASE_URL', default='') | replace(from='\\', to='\\\\') | replace(from='\"', to='\\\"') %>"
  # The media volume (ADR 0015 §3): three sibling directories under the
  # git-ignored target/ here, the volume at /data in production. Create
  # `root` before the first upload (uploads refuse to start without it, as
  # they do in production before the volume is mounted); `tmp_dir` and the
  # entity image folders below `root` are created when missing.
  # `min_free_bytes`: uploads are refused below 2 GiB of free space.
  # `public_base_url`: the base of the public API's absolute media URLs,
  # with no trailing slash (public-api.md §2.3), here this server's, which
  # serves no /storage unless serve_storage is on (ADR 0015 §4).
  # `serve_storage`: the fallback of ADR 0015 §4, off. Checked at boot;
  # whether the directories exist is checked by each upload.
  media:
    root: target/media/development/public
    tmp_dir: target/media/development/tmp
    trash_dir: target/media/development/trash
    min_free_bytes: 2147483648
    public_base_url: "http://localhost:5150/storage"
    serve_storage: false

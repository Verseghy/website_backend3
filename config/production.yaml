# Loco configuration of the `production` environment: the backend3 image on
# the edge node, its CronJobs, and staging on the hub (ADR 0014, ADR 0016).
#
# Only this file reads the environment, through `get_env` (ADR 0008,
# ADR 0023 §11). A secret or an address takes no default: `get_env` without a
# default fails at startup when the variable is unset, which is safer than
# falling back to a development value. Required variables:
#
#   DATABASE_URL  postgres://website_backend3:<password>@postgres:5432/verseghy
#                 (built by the Deployment from the backend-secrets key,
#                 ADR 0002, ADR 0023 §11)
#   HOST          https://backend3.microshift.verseghy-gimnazium.net (ADR 0014)
#   JWT_SECRET    the admin session secret: base64 of at least 64 random
#                 bytes, from the backend-secrets key backend3-jwt-secret
#                 (ADR 0006 §1, ADR 0023 §11)
#   TOTP_ENCRYPTION_KEY
#                 base64 (standard alphabet, `=` padding) of at least 64
#                 random bytes, on one line with no trailing newline: the
#                 backend-secrets key backend3-totp-key, separate from the
#                 JWT secret (ADR 0006 §6, ADR 0023 §11). Every command
#                 refuses to start when it is unset, not base64 or shorter,
#                 or the public throwaway key of the local configuration
#                 files (ADR 0034 §3; D75, research: DECISIONS R15).
#
# Operators do not run `backend3-cli doctor --config` here: it prints the
# whole rendered configuration, these secrets included.
#
# Optional: LOG_LEVEL, DB_AUTO_MIGRATE (default false: boot runs no
# migration, so backend3 also boots against a read-only database, ADR 0003),
# DB_MAX_CONNECTIONS, DB_CONNECT_TIMEOUT, DB_IDLE_TIMEOUT, and
# PNG_PRESET_THRESHOLD_PIXELS (below; set by the Deployment from the
# measurement on the production node, ADR 0033 §5).
#
# Safety (ADR 0024 §4, layer 3): `App::load_config` refuses
# dangerously_truncate, dangerously_recreate and queue.dangerously_flush here,
# and backend3-cli refuses `db reset`, `db truncate` and `db seed --reset`.

logger:
  enable: true
  pretty_backtrace: false
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # JSON to stdout, read with `oc logs` (ADR 0023 §9).
  format: json

server:
  port: 5150
  # All interfaces: the pod is reached through its Service.
  binding: 0.0.0.0
  host: <%= get_env(name="HOST") %>
  middlewares:
    # ADR 0004 §3: the /admin router replaces Loco's static middleware, and
    # the development welcome fallback is off.
    static:
      enable: false
    fallback:
      enable: false
    compression:
      enable: true
    # public-api.md §9: a request whose If-None-Match equals the ETag of a
    # public answer gets 304 Not Modified without a body. Loco turns it on
    # when the key is absent; it is written out, with `enable`, because a
    # key without `enable: true` turns it off (the vendored Loco skill,
    # recipes/middleware.md).
    etag:
      enable: true
    # ADR 0023 §6: HSTS, nosniff, X-Frame-Options and the rest of the github
    # preset on every response, and a deny-all CSP for the JSON API. /admin
    # sets its own CSP and admin headers, which win because secure_headers
    # never overwrites a header that is already present.
    secure_headers:
      enable: true
      preset: github
      overrides:
        Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        Referrer-Policy: "strict-origin-when-cross-origin"

# ADR 0016 §3: durable jobs on the Postgres queue, processed inside the web
# process (`start --server-and-worker`, the image's default command).
workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: <%= get_env(name="DATABASE_URL") %>
  max_connections: 2
  min_connections: 1
  num_workers: 1
  poll_interval_sec: 5
  dangerously_flush: false
  reaper:
    age_minutes: 30
    interval_seconds: 300

# ADR 0016 §2: set explicitly, never the 1.2.0 default of 33,554,432 entries.
cache:
  kind: InMem
  max_capacity: 1000

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  # Pool sizes are starting values for a small edge node; revisit them once
  # its real capacity is known (ADR 0016, follow-up work). Idle connections
  # are kept for ten minutes, the sqlx default, instead of the template's
  # 500 ms, so bursts do not reconnect on every request.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="600000") %>
  min_connections: 1
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="5") %>
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="false") %>
  dangerously_truncate: false
  dangerously_recreate: false

# The admin session (ADR 0006 §1): HS512, the Loco default. JWT_SECRET has no
# default, so the configuration does not load without it and the server does
# not start. Quoted, so that YAML always reads it as text.
auth:
  jwt:
    secret: "<%= get_env(name="JWT_SECRET") %>"
    # Two hours (ADR 0006 §1); the session cookie's Max-Age is this value.
    expiration: 7200
    # The session cookie first, then the Bearer header of scripts.
    location:
      - from: Cookie
        name: __Host-admin_session
      - from: Bearer

settings:
  admin_ui:
    # Where the runtime stage of the Containerfile copies admin/dist
    # (ADR 0004 §2). The server refuses to start when it or its index.html
    # is missing.
    dist_dir: /app/admin/dist
  # /metrics, OpenMetrics text, on the pod's `metrics` port (ADR 0023 §9).
  # All interfaces, like the server, so the Service reaches it. No Route
  # ever targets this port: the metrics are never public (ADR 0014).
  metrics:
    binding: 0.0.0.0
    port: 9464
  admin_auth:
    # Encrypts the stored TOTP secrets (ADR 0006 §6). No default: an unset
    # variable stops every command with an error naming it.
    #
    # The value is rendered into a double-quoted YAML string, so it stays a
    # string whatever it looks like, and the two `replace` filters escape
    # its backslashes and double quotes for that string. Any value then
    # reaches the typed check, which names this key when the value is not
    # base64; YAML first folds a line break into a space, which the check
    # refuses. Only a control character other than tab, CR or LF fails
    # earlier, as a YAML error naming this file. Before rendering the line
    # is valid YAML too: the Tera strings are single-quoted, and the YAML
    # escapes in them read the same to Tera.
    totp_encryption_key: "<%= get_env(name='TOTP_ENCRYPTION_KEY') | replace(from='\\', to='\\\\') | replace(from='\"', to='\\\"') %>"
  # How uploaded images are optimised (ADR 0015 §7, ADR 0033). `png`: oxipng's
  # preset 2 up to `threshold_pixels` pixels and the cheaper `large_preset`
  # (0 or 1) above, so a PNG at the pixel budget finishes inside the 120 s
  # /api/admin timeout (ADR 0033 §5). The threshold is set from a
  # measurement on the production node; until then the default derived in
  # src/domain/image_optimise/png/effort.rs. Checked at boot: a value that
  # breaks the rule stops the server with the key and what to change.
  image_optimisation:
    png:
      threshold_pixels: <%= get_env(name="PNG_PRESET_THRESHOLD_PIXELS", default="6000000") %>
      large_preset: 0

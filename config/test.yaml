# Loco configuration of the `test` environment: `cargo test`, `cargo nextest`
# and the Test CI job.
#
# Safety (ADR 0024 §4, layer 3): `App::load_config` refuses any database host
# here that is not local (localhost, 127.0.0.1, ::1 or a Unix socket), before
# anything connects. Tests use Loco's per-test databases
# (`request_with_create_db`, `boot_test_with_create_db`): each test creates
# its own `_loco_test_<random>_<timestamp>` database next to backend3_test and
# migrates it, so the destructive `dangerously_*` flags of Loco's template are
# not needed and stay off. The role needs CREATEDB; compose.yaml's role is a
# superuser.

logger:
  # Test output stays readable; enable locally when debugging a test.
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  binding: localhost
  host: http://localhost
  middlewares:
    # ADR 0004 §3: the /admin router replaces Loco's static middleware, and
    # the development welcome fallback is off everywhere.
    static:
      enable: false
    fallback:
      enable: false
    # ADR 0015 §6, ADR 0023 §5: request bodies up to 128 MiB (134,217,728
    # bytes), for media uploads; Loco's default is 2,000,000 bytes. The
    # admin API's JSON routes take at most 4 MiB, a limit of their own in
    # controllers::admin::routes. A body above either limit is answered 413
    # with the admin error envelope.
    limit_payload:
      body_limit: 128mib
    compression:
      enable: true
    # public-api.md §9: a request whose If-None-Match equals the ETag of a
    # public answer gets 304 Not Modified without a body. Loco turns it on
    # when the key is absent; it is written out, with `enable`, because a
    # key without `enable: true` turns it off (the vendored Loco skill,
    # recipes/middleware.md).
    etag:
      enable: true
    # ADR 0023 §6: the global headers. API responses are JSON and never
    # rendered, so their CSP allows nothing. /admin overrides the CSP and the
    # frame, referrer, permissions, opener and robots headers itself.
    secure_headers:
      enable: true
      preset: github
      overrides:
        Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        Referrer-Policy: "strict-origin-when-cross-origin"
    # ADR 0023 §2's client address: the rightmost X-Forwarded-For value, or
    # the socket address without that header. The sign-in and account
    # entries of the activity log record it (ADR 0011 §5), and the request
    # tests check it against this, the source ADR 0023 §2 gives production.
    # Loco leaves the middleware off when the key is absent.
    remote_ip:
      enable: true
      source: RightmostXForwardedFor

# Jobs run inline and deterministically in tests (ADR 0016 §3), so no queue
# connection is configured.
workers:
  mode: ForegroundBlocking

# The cache is an optimisation only; tests run with the Null cache, which
# proves that every code path works without it (ADR 0016 §2).
cache:
  # Quoted: a bare Null is the YAML null literal, not the variant name.
  kind: "Null"

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/backend3_test") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: 1
  max_connections: 2
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

# The admin session (ADR 0006 §1). The secret is a throwaway local value,
# public like the compose password and allowed by ADR 0034 §2: the base64 of
# the sentence
# "backend3 test JWT secret: public and throwaway, used only by the Rust test
# suite." Production reads its own from JWT_SECRET
# and refuses this value at boot (Settings::refuse_published_keys,
# ADR 0034 §3).
auth:
  jwt:
    secret: "YmFja2VuZDMgdGVzdCBKV1Qgc2VjcmV0OiBwdWJsaWMgYW5kIHRocm93YXdheSwgdXNlZCBvbmx5IGJ5IHRoZSBSdXN0IHRlc3Qgc3VpdGUu"
    # Two hours (ADR 0006 §1); the session cookie's Max-Age is this value.
    expiration: 7200
    # The session cookie first, then the Bearer header of scripts.
    location:
      - from: Cookie
        name: __Host-admin_session
      - from: Bearer

settings:
  admin_ui:
    # The fixture with a stub index.html and one hashed asset, so Rust tests
    # never need a Node build (ADR 0004 §4). Relative to the package root,
    # the working directory of cargo test and nextest.
    dist_dir: tests/fixtures/admin-dist
  # The /metrics listener (ADR 0023 §9). Tests never bind this port: the
  # serve test binds ephemeral listeners of its own, so parallel tests do not
  # collide (tests/requests/metrics.rs).
  metrics:
    binding: 127.0.0.1
    port: 9464
  admin_auth:
    # The key that encrypts stored TOTP secrets (ADR 0006 §6). A throwaway
    # local value, public like the compose database's loco/loco and not a
    # secret, as ADR 0034 §2 item 3 allows
    # (docs/design/adr/0034-test-hashes-and-throwaway-keys-refused-in-production.md):
    # the base64 of the 110-byte sentence "backend3 TOTP encryption key:
    # public and throwaway, for development, test and e2e only; production
    # refuses it." Production reads its own key from TOTP_ENCRYPTION_KEY,
    # with no default, and refuses this one at boot (ADR 0034 §3).
    totp_encryption_key: "YmFja2VuZDMgVE9UUCBlbmNyeXB0aW9uIGtleTogcHVibGljIGFuZCB0aHJvd2F3YXksIGZvciBkZXZlbG9wbWVudCwgdGVzdCBhbmQgZTJlIG9ubHk7IHByb2R1Y3Rpb24gcmVmdXNlcyBpdC4="
    # The session limits and credential lifetimes of ADR 0006 §8, with the
    # ADR's defaults, which the maintainer kept (research: DECISIONS R9,
    # D07). No key has a default in the code, so each is written out; boot
    # refuses a duration of 0 and an absolute limit below 7200, naming the
    # key. `session_absolute_max_secs`: no session refresh sets an expiry
    # later than the sign-in plus this, 12 hours (ADR 0006 §1).
    session_absolute_max_secs: 43200
    # A reset link lasts 24 hours, a temporary password 72 hours (§5).
    reset_link_ttl_secs: 86400
    temp_password_ttl_secs: 259200
    # A legacy password shorter than 12 characters yields only a
    # password_change session (§6).
    force_change_short_legacy_password: true
  # How uploaded images are optimised (ADR 0015 §7, ADR 0033).
  # `pixel_budget`: the largest pixel count decoded for one image, 50
  # megapixels (ADR 0015 §7). `png`: the oxipng preset by image size
  # (ADR 0033 §5), preset 2 up to `threshold_pixels` pixels and the cheaper
  # `large_preset` (0 or 1) above; the default derived in
  # src/domain/image_optimise/png/effort.rs. Checked at boot.
  image_optimisation:
    pixel_budget: 50000000
    png:
      threshold_pixels: 6000000
      large_preset: 0
  # The legacy import's source (data-migration.md §4.1): none. This file does
  # not read IMPORT_SOURCE_DATABASE_URL, so a variable left in a shell cannot
  # change a run; a test that runs the import_mysql task sets the source in
  # the app context it runs the task with, and the task accepts only a local
  # one here (ADR 0024 §4, layer 3).
  import:
    source_database_url: ""
  # The media volume (ADR 0015 §3): three sibling directories under the
  # git-ignored target/ here, the volume at /data in production. Create
  # `root` before the first upload (uploads refuse to start without it, as
  # they do in production before the volume is mounted); `tmp_dir` and the
  # entity image folders below `root` are created when missing.
  # `min_free_bytes`: uploads are refused below 2 GiB of free space.
  # `public_base_url`: the base of the public API's absolute media URLs,
  # with no trailing slash (public-api.md §2.3), here the test server's.
  # Tests that write files pass media settings of their own, under
  # target/, so parallel tests never share a directory.
  # `serve_storage`: the fallback of ADR 0015 §4, off. Checked at boot;
  # whether the directories exist is checked by each upload.
  media:
    root: target/media/test/public
    tmp_dir: target/media/test/tmp
    trash_dir: target/media/test/trash
    min_free_bytes: 2147483648
    public_base_url: "http://localhost/storage"
    serve_storage: false

# website_backend3: the Loco application `backend3` (ADR 0002, ADR 0004,
# ADR 0008, ADR 0022, ADR 0024).
#
# The workspace holds two crates: this package and `migration/` (Sea-ORM
# migrations). `migration` is a path dependency inside the workspace directory,
# so Cargo makes it a member automatically; `--workspace` covers both.
#
# Every dependency requirement of both crates is declared once, in
# [workspace.dependencies] below; the crates' own dependency tables only
# inherit it with `{ workspace = true }`. In a root manifest that has that
# table, Dependabot rewrites no other one (.github/dependabot.yml), so a
# requirement in this package's own tables would get every update beyond
# it as a Cargo.lock-only PR that fails every `--locked` job.
# migration/Cargo.toml inherits as well, although Dependabot would rewrite
# it: that way each requirement and its reason live in one place, and the
# two crates cannot drift apart. scripts/ci/check-workspace-deps.sh (the
# Toolchain job) enforces the rule.

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
# loco-rs 1.2.0 and Sea-ORM 2.0 both declare rust-version 1.94. The exact
# compiler is pinned in rust-toolchain.toml (ADR 0022 §3).
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/Verseghy/website_backend3"
publish = false

[workspace.dependencies]
# How an entry is written, following Cargo's rules for inherited dependencies:
# - The entry here holds the version requirement, `default-features = false`
#   (a member cannot turn default features off) and, for a renamed crate,
#   `package`. It also holds the features that every crate using it needs.
# - A member adds the features only it needs next to `workspace = true`;
#   features only add up, a member cannot remove one. `optional = true` is
#   written in the member that makes the dependency optional.
# - Each entry carries the comment that says why the crate, its version line
#   and its features are here.
# - Each registry entry is `name = "requirement"`, an inline table that
#   holds `version` (`name = { version = "requirement", ... }`) or a
#   [workspace.dependencies.name] table with `version = "requirement"`, all
#   with bare keys. Dependabot rewrites the requirement in place, keeping
#   the comments, by searching for those forms: between
#   [workspace.dependencies] and the next line that starts with "[", or in
#   the named table (`WorkspaceManifestUpdater` in
#   dependabot-core@77f70df:cargo/lib/dependabot/cargo/file_updater/workspace_manifest_updater.rb).
#   It does not find a dotted key (`name.version = "..."`) or a quoted one
#   (`"name" = "..."`), so their updates would change only Cargo.lock
#   again; scripts/ci/check-workspace-deps.sh rejects them. A path entry
#   (`migration`) has no requirement for Dependabot to rewrite. A renamed
#   entry gets no Dependabot version updates, because Dependabot's parser
#   skips it; it is bumped by hand.

# Exact pin (ADR 0024 §3): the vendored Loco skill in .claude/skills/loco/ is a
# byte copy of this crate version's skills/loco/. Bumps are dedicated PRs that
# re-sync the skill; Dependabot ignores this crate.
#
# Default features are off (ADR 0022 §2). What backend3 adds back, and why:
#   auth        - JWT support for the admin session and Bearer tokens (ADR 0006).
#   cli         - the `backend3-cli` binary: `start`, `db`, `task`, `jobs`
#                 (ADR 0016 CronJobs run this binary, not `cargo loco`).
#   with-db     - Sea-ORM and sea-orm-migration on PostgreSQL (ADR 0002).
#   cache_inmem - the small per-pod moka cache (ADR 0016 §2).
#   worker      - the Postgres job queue, `queue.kind: Postgres` (ADR 0016 §3).
# Deliberately not enabled: db-sqlite (no SQLite, so no libsqlite3-sys C
# build), cache_redis and worker_redis (no Redis, ADR 0016 §1), the storage_*
# cloud drivers, embedded_assets and multi-tenancy.
loco-rs = { version = "=1.2.0", default-features = false, features = [
  "auth",
  "cli",
  "with-db",
  "cache_inmem",
  "worker",
] }
# The workspace's migration crate (ADR 0009); backend3 passes its `Migrator`
# to Loco. A path dependency, so Dependabot never proposes an update for it.
migration = { path = "migration" }

# Async runtime for the CLI entry point (`#[tokio::main]`), and `net` for the
# listener of `App::serve`. backend3 adds `net` in its own dependency table,
# and its test dependencies add `sync` and `time`.
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "macros",
] }
async-trait = "0.1"
# axum and tower-http are the versions Loco 1.2.0 builds on (axum 0.8,
# tower-http 0.6); the caret ranges keep a single copy of each in the graph.
# `fs` gives ServeDir/ServeFile and `set-header` the response-header layer of
# the /admin router (ADR 0004 §3); Loco already enables both features.
# `normalize-path` trims trailing slashes before routing (`App::serve`,
# public-api.md DEC-10); it adds no dependency.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "normalize-path"] }
# Sea-ORM with the PostgreSQL driver only (ADR 0022 §2). Models generated by
# `cargo loco generate model` and `cargo loco db entities` use it directly.
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
# sea-orm-migration, for migration/ (ADR 0009). The async runtime feature;
# the PostgreSQL driver feature comes in through loco-rs (`with-db`), and no
# SQLite or MySQL driver is enabled here.
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Names the full key path (`settings.admin_ui.dist_dir`) in settings errors
# (ADR 0008, "Typed configuration").
serde_path_to_error = "0.1"
thiserror = "2"
tracing = "0.1"
# URI parsing for the database-target guard. sqlx parses connection URIs with
# this same crate, so the guard sees the host exactly as the driver will.
url = "2"
percent-encoding = "2"
# DTO-to-TypeScript bindings for the admin API (ADR 0005 §2): major 12 with
# chrono-impl and serde-compat, as in Loco's own template.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
# The /api/v1 OpenAPI document (ADR 0005 §2, §4): the `OpenApi` derive of
# src/controllers/v1/openapi.rs and `#[utoipa::path]` on Loco handlers. Major
# 6, which the ADR 0005 §5 spike tried with loco-rs 1.2.0
# (docs/design/openapi-spike.md). Default features only; a slice that needs a
# type feature adds it with its reason. `preserve_path_order` and
# `preserve_order` stay off, so paths and properties are sorted by name and
# the snapshot does not depend on declaration order.
utoipa = "6"
# Dates, wall times and instants (ADR 0010): the chrono 0.4 types of Loco's
# prelude, Sea-ORM 2.0 and ts-rs's `chrono-impl` (loco-rs 1.2.0 requires "0.4"),
# and the UTC instant of the app clock. The default `clock` feature gives
# `Utc::now` for the system clock in src/app.rs, and also chrono's `Local`
# (Loco turns it on as well), so tests/architecture.rs keeps `Local` and every
# other read of the system time out of src/.
chrono = "0.4"
# The compiled-in tz database of src/domain/budapest.rs, pinned exactly (ADR
# 0010 point 5): new tz data can move the Budapest wall time of a stored
# instant. 0.10.4 carries tz data 2025b, which budapest::TZ_DATA_VERSION records
# and a unit test checks. loco-rs 1.2.0's scheduler (tokio-cron-scheduler 0.15)
# already builds this release, so it adds no crate to Cargo.lock.
chrono-tz = "=0.10.4"
# Metrics library (ADR 0023 §9), picked by the bootstrap PR after checking the
# releases on 2026-10-24: `prometheus-client` (0.25.1 of 2026-09-01), the
# Prometheus project's own client. Its `Registry` is an explicit value that
# is handed down like any other handle (ADR 0008), it writes the OpenMetrics
# text format that Prometheus scrapes, and it brings 3 crates that are not yet
# in this graph. `metrics` 0.24 with `metrics-exporter-prometheus` 0.18 and
# `metrics-process` 2.4 would bring 14 and a process-global recorder. Process
# CPU and memory come from a small `/proc/self` reader, with its parser in
# `src/domain/`. PLT-24 adds the dependency together with the `/metrics`
# listener of `App::serve`.

# Test-only crates (backend3's [dev-dependencies]).
proptest = "1"
# The response type of Loco's test server, named in test helpers. Same major
# as loco-rs 1.2.0 uses, so one copy is built.
axum-test = "17"
# `catch_unwind` on futures, so the per-test database is dropped even when a
# test panics (tests/support).
futures-util = "0.3"
# The committed snapshot of the /api/v1 OpenAPI document (ADR 0005 §4): "a
# snapshot change is an API change". CI sets CI=true and INSTA_UPDATE=no, so
# a mismatch fails and no .snap.new is written. No extra features.
insta = "1"

[package]
name = "backend3"
version = "0.1.0"
description = "Backend of the Verseghy Ferenc Gimnázium website: admin API, admin UI and public read API"
default-run = "backend3-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
# No unsafe code anywhere in the workspace. Tests that would need
# `std::env::set_var` (unsafe since edition 2024) start a child process with
# its own environment instead.
unsafe_code = "forbid"
# Every public item carries documentation (the repository's engineering bar).
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# backend3's dependencies. The requirements, shared features and reasons are
# in [workspace.dependencies] above; a new dependency goes there first.
[dependencies]
loco-rs = { workspace = true }
migration = { workspace = true }
# `net` for the listener of `App::serve`.
tokio = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
ts-rs = { workspace = true }
utoipa = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }

[[bin]]
name = "backend3-cli"
path = "src/bin/main.rs"

[dev-dependencies]
# Loco's test harness: request helpers and per-test databases.
loco-rs = { workspace = true, features = ["testing"] }
# `sync` and `time` for tests/models/task_lock.rs: a `Notify` and a time limit.
tokio = { workspace = true, features = ["sync", "time"] }
proptest = { workspace = true }
axum-test = { workspace = true }
futures-util = { workspace = true }
insta = { workspace = true }

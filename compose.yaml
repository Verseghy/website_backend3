# A throwaway local PostgreSQL for tests, development and CI (ADR 0002,
# ADR 0022 §3), and, under the profile `import`, the throwaway MySQL source
# of the legacy import (the `mysql` service below). Start both with
# `podman-compose --profile import up -d` (or `docker compose --profile
# import up -d`); without the profile, `up -d` starts PostgreSQL only.
#
# - The major version matches production: PostgreSQL 18. The image is pinned
#   by the digest of its multi-arch index; a bump changes tag and digest
#   together.
# - The locale matches production too: initdb runs with the builtin C.UTF-8
#   locale (POSTGRES_INITDB_ARGS below). CI's Test job checks it.
# - The credentials are local throwaway values, not secrets. POSTGRES_USER is
#   the image's bootstrap superuser, so it may CREATE DATABASE for Loco's
#   per-test databases (`_loco_test_<random>_<timestamp>`).
# - All three local databases exist from the first start: backend3_test
#   (POSTGRES_DB), and backend3_development and backend3_e2e from the init
#   script below. They cannot come from `backend3-cli db create`: loco-rs
#   1.2.0's CLI connects to the configured database before it runs any
#   subcommand, so `db create` fails when that database does not exist yet.
# - The port is published on loopback only. The data lives in a tmpfs, so
#   every start begins empty and nothing is left on disk.
services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: backend3_test
      # Production parity (research: DECISIONS R13): the locale arguments
      # that production's initdb gets, copied exactly from
      # website_k8s@f0286dc:verseghy-website/postgres/deployment.yaml. The
      # builtin C.UTF-8 locale sorts by code point and does not depend on the
      # image's glibc; Hungarian order comes from the explicit hu_icu
      # collation (ADR 0020). Without them the image initialises with its
      # libc en_US.utf8 default, a default collation and character
      # classification that production does not have. Every database here,
      # Loco's per-test ones included, copies template1's locale, and the CI
      # Test job fails unless template1 reports this one.
      # Production's other two arguments, --auth-local and --auth-host, are
      # left out on purpose: they only keep the pg_hba.conf that production
      # replaces free of trust lines, while `docker compose exec postgres
      # psql` (the CI locale check and the E2E database step) relies on the
      # image's trust for local socket connections.
      # initdb reads this when it initialises the data directory (here: at
      # every start, because of the tmpfs), from the environment the
      # container was created with. `podman-compose up -d postgres` (or
      # `docker compose up -d`) sees the changed service and recreates a
      # container created from an older compose.yaml, so it picks this up;
      # `podman-compose up -d --force-recreate postgres` recreates it in any
      # case. `podman start`, `podman-compose start` or `restart` and
      # `up --no-recreate` reuse the old container, which keeps en_US.utf8.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    # The image runs every file in /docker-entrypoint-initdb.d once, when the
    # data directory is initialised (here: on every start, because of the
    # tmpfs). Write the script, then hand over to the image's own entrypoint
    # with its default command.
    entrypoint:
      - sh
      - -c
      - |
        printf '%s\n' \
          'CREATE DATABASE backend3_development;' \
          'CREATE DATABASE backend3_e2e;' \
          > /docker-entrypoint-initdb.d/10-backend3-databases.sql
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      # PostgreSQL 18 images keep their data below /var/lib/postgresql.
      - /var/lib/postgresql
    healthcheck:
      # Over TCP on purpose: during initialisation the image runs a temporary
      # server that listens on the Unix socket only, so a socket check could
      # report healthy before the init script has run and the final server is
      # up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U loco -d backend3_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # The legacy import's source (data-migration.md §3.3, §12): a throwaway
  # MySQL with the legacy schema and no rows, which the import_mysql tests
  # read and which local import runs use. It is under the profile `import`,
  # so a plain `up -d` leaves it out; the CI Test job and the local gate
  # start it (AGENTS.md, "Before you call it done").
  #
  # - The server matches production's: the official image at the tag that
  #   website_k8s runs (website_k8s@f0286dc:verseghy-website/mysql/kustomization.yaml),
  #   pinned by the digest of its multi-arch index. As for PostgreSQL,
  #   nothing bumps the pin automatically; a bump changes tag and digest
  #   together, to the tag that website_k8s then runs.
  # - The schema is tests/fixtures/legacy/schema.sql, the expected legacy
  #   DDL, which the image loads into MYSQL_DATABASE when it initialises the
  #   data directory (here: at every start, because of the tmpfs).
  # - The account is `loco`/`loco`, the same local throwaway values as
  #   PostgreSQL's, not secrets. It has exactly the grants of the cut-over's
  #   source account, SELECT and LOCK TABLES on `verseghy` (§3.3), so the
  #   tests read the source with no more rights than production's import
  #   has. The root account signs in only inside the container
  #   (MYSQL_ROOT_HOST), with a random password that the image prints to its
  #   log at the start; nothing needs it, and the CI step that shows this
  #   log on a failure drops that line.
  # - The URL is mysql://loco:loco@127.0.0.1:3306/verseghy: the port is
  #   published on loopback only, so the import's source guard accepts it
  #   in test and development, where it refuses the container-network name
  #   `mysql` (ADR 0024 §4, layer 3). The default ssl-mode, PREFERRED, signs
  #   in over TLS with the certificate that the image generates, which
  #   MySQL 8.4's caching_sha2_password needs (Cargo.toml, the sqlx entry).
  mysql:
    profiles: ["import"]
    image: docker.io/library/mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: verseghy
    # As for PostgreSQL: write the account script, then hand over to the
    # image's own entrypoint with its default command. The image runs the
    # files of /docker-entrypoint-initdb.d in name order, the .sql ones in
    # MYSQL_DATABASE, so the schema exists before the grants name it.
    entrypoint:
      - sh
      - -c
      - |
        printf '%s\n' \
          "CREATE USER 'loco'@'%' IDENTIFIED BY 'loco';" \
          "GRANT SELECT, LOCK TABLES ON verseghy.* TO 'loco'@'%';" \
          > /docker-entrypoint-initdb.d/20-import-account.sql
        exec docker-entrypoint.sh mysqld
    volumes:
      # Read-only; `z` lets SELinux hosts (podman on Fedora) share the file
      # with the container, and docker ignores it elsewhere.
      - ./tests/fixtures/legacy/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro,z
    ports:
      - "127.0.0.1:3306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # Over TCP on purpose, as for PostgreSQL: the image initialises with a
      # temporary server that skips networking, so a TCP answer comes only
      # from the final server, after the schema and the account exist.
      # `mysqladmin ping` succeeds for any answering server, even one that
      # refuses the (absent) credentials.
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--port=3306", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
